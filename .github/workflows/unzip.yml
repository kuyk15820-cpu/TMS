name: Build TrollMemScan

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Display Name'
        required: false
        default: 'TrollMemScan'
      bundle_id:
        description: 'Bundle Identifier'
        required: false
        default: 'com.apple.TrollMemScan'
      app_version:
        description: 'App Version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'
      build_number:
        description: 'Build Number (e.g. 1)'
        required: false
        default: '1'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: setup xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: show xcode version
        run: xcodebuild -version

      - name: install dependencies (ldid, dpkg)
        run: |
          brew install ldid dpkg

      # 🟢 ขั้นตอนอัปเดตชื่อแอป, Bundle ID และ Version จาก Input ของ GitHub Actions
      - name: update app metadata (name, bundle id, version)
        env:
          APP_NAME: ${{ github.event.inputs.app_name || 'TrollMemScan' }}
          BUNDLE_ID: ${{ github.event.inputs.bundle_id || 'com.apple.TrollMemScan' }}
          APP_VERSION: ${{ github.event.inputs.app_version || '1.0.0' }}
          BUILD_NUMBER: ${{ github.event.inputs.build_number || '1' }}
        run: |
          gem install xcodeproj
          ruby << 'EOF'
          require 'xcodeproj'

          project_path = Dir.glob('*.xcodeproj').first
          unless project_path
            puts 'No .xcodeproj found'
            exit 1
          end

          project = Xcodeproj::Project.open(project_path)
          
          app_name = ENV['APP_NAME']
          bundle_id = ENV['BUNDLE_ID']
          app_version = ENV['APP_VERSION']
          build_number = ENV['BUILD_NUMBER']

          puts "Updating App Configuration:"
          puts "  - App Name: #{app_name}"
          puts "  - Bundle ID: #{bundle_id}"
          puts "  - Version: #{app_version}"
          puts "  - Build Number: #{build_number}"

          project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['PRODUCT_NAME'] = app_name
              config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = bundle_id
              config.build_settings['MARKETING_VERSION'] = app_version
              config.build_settings['CURRENT_PROJECT_VERSION'] = build_number
              config.build_settings['INFOPLIST_KEY_CFBundleDisplayName'] = app_name
            end
          end

          project.save
          puts "Successfully updated project build settings!"
          EOF

      # 🟢 ระบบเพิ่มไฟล์อัตโนมัติเฉพาะไฟล์ใหม่ (ไม่ดึงไฟล์เดิมมาแอดซ้ำซ้อน)
      - name: sync swift files and packages to xcodeproj
        run: |
          gem install xcodeproj
          ruby << 'EOF'
          require 'xcodeproj'
          
          project_path = Dir.glob('*.xcodeproj').first
          unless project_path
            puts 'No .xcodeproj found'
            exit 1
          end

          project = Xcodeproj::Project.open(project_path)
          target = project.targets.first

          # เพิ่ม Header Search Paths ให้ค้นหาไฟล์ .h ในทุกโฟลเดอร์ย่อยอัตโนมัติ
          target.build_configurations.each do |config|
            config.build_settings['HEADER_SEARCH_PATHS'] ||= '$(inherited)'
            paths = config.build_settings['HEADER_SEARCH_PATHS']
            paths = [paths] if paths.is_a?(String)
            unless paths.include?('$(SRCROOT)/**')
              config.build_settings['HEADER_SEARCH_PATHS'] = paths + ['$(SRCROOT)/**']
            end
          end
          
          # ดึงรายชื่อไฟล์ที่มีอยู่ในโปรเจกต์และ Build Phases อยู่แล้วเพื่อข้ามการแอดซ้ำ
          existing_file_paths = target.source_build_phase.files_references.map { |f| f.real_path.to_s rescue nil }.compact

          Dir.glob('**/*.{swift,m,mm,cpp,h}').each do |source_file|
            next if source_file.start_with?('Pods/', 'Build/', '.build/', 'DerivedData/')
            
            file_abs_path = File.expand_path(source_file)

            # ถ้ามีไฟล์นี้อยู่แล้ว ข้ามทันทีไม่แอดซ้ำ
            next if existing_file_paths.include?(file_abs_path)

            file_ref = project.files.find { |f| f.real_path.to_s == file_abs_path }
            unless file_ref
              file_ref = project.main_group.new_file(source_file)
            end

            if source_file.end_with?('.swift', '.m', '.mm', '.cpp')
              target.source_build_phase.add_file_reference(file_ref)
              puts "Added new file to compile sources: #{source_file}"
            elsif source_file.end_with?('.h')
              puts "Added new header reference: #{source_file}"
            end
          end

          project.save
          puts "Successfully synced new source files!"
          EOF

      # 🟢 ตั้งค่า Symbol Stripping และ Compiler Optimization ป้องกัน Reverse Engineering
      - name: setup obfuscation & security flags
        run: |
          ruby << 'EOF'
          require 'xcodeproj'
          project_path = Dir.glob('*.xcodeproj').first
          project = Xcodeproj::Project.open(project_path)
          
          project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['STRIP_INSTALLED_PRODUCT'] = 'YES'
              config.build_settings['DEPLOYMENT_POSTPROCESSING'] = 'YES'
              config.build_settings['STRIP_STYLE'] = 'all'
              
              config.build_settings['SWIFT_OPTIMIZATION_LEVEL'] = '-O'
              config.build_settings['SWIFT_COMPILATION_MODE'] = 'wholemodule'
              config.build_settings['OTHER_SWIFTC_FLAGS'] ||= '$(inherited)'
              config.build_settings['OTHER_SWIFTC_FLAGS'] += ' -Xfrontend -empty-abi-descriptor'
            end
          end
          project.save
          puts "Successfully applied Symbol Stripping & Security Flags"
          EOF

      # 🟢 สั่งรัน Makefile เพื่อคอมไพล์และแพ็กไฟล์ .tipa ตามต้องการ
      - name: build with makefile
        run: |
          make
        env:
          TMPDIR: ${{ runner.temp }}

      # 🟢 อัปโหลด Artifact เฉพาะตอน Pull Request
      - name: upload artifact (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: |
            *.tipa
            build/*.tipa

      # 🟢 อัปโหลด Release Artifact ตอน Push เข้า Main/Master หรือกด Trigger เอง
      - name: upload release ipa
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: release-ipa
          path: |
            *.tipa
            build/*.tipa


  release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: download ipa
        uses: actions/download-artifact@v4
        with:
          name: release-ipa
          path: build/

      - name: get last 12h commits
        run: |
          COMMITS=$(git log --since="12 hours ago" --pretty=format:"- %h %s (%an)")
          if [ -z "$COMMITS" ]; then
            COMMITS="no commits in the last 12 hours"
          fi

          echo "COMMITS<<EOF" >> $GITHUB_ENV
          echo "$COMMITS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: write release notes
        run: |
          cat <<EOF > release_notes.txt
          Nightly build
          
          Last 12 hours commits:
          
          ${COMMITS}
          EOF

      - name: update nightly release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view nightly >/dev/null 2>&1 || \
          gh release create nightly \
            --title "Nightly" \
            --notes "initial nightly" \
            --prerelease
      
          gh release edit nightly \
            --title "Nightly" \
            --notes-file release_notes.txt \
            --prerelease      
          
          for asset in $(gh release view nightly --json assets -q '.assets[].name'); do
            echo "Deleting old asset: $asset"
            gh release delete-asset nightly "$asset" -y || true
          done

          gh release upload nightly build/*.tipa --clobber
