name: Build iMemScan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App (TrollStore & DEB)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies (ldid, dpkg)
        run: |
          brew install ldid dpkg

      - name: Build with Make
        run: |
          make
        env:
          TMPDIR: ${{ runner.temp }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iMemScan-Artifacts
          path: |
            iMemScanTS.tipa
            build/AppIndex.deb
            build/AppIndexRootless.deb
